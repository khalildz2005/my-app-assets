<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم AMR Store</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e2e; color: #cdd6f4; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: #313244; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        input, button, textarea { width: 90%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #45475a; background: #181825; color: #cdd6f4; font-size: 16px; outline: none; }
        input:focus, textarea:focus { border-color: #89b4fa; }
        button { background: #89b4fa; color: #11111b; font-weight: bold; cursor: pointer; border: none; font-size: 18px; transition: 0.3s; }
        button:hover { background: #74c7ec; transform: scale(0.98); }
        textarea { height: 200px; direction: ltr; text-align: left; }
        
        /* تصميم قسم المعاينة الجديد */
        .preview-section { display: none; background: #181825; padding: 15px; border-radius: 10px; margin-top: 20px; border: 1px solid #45475a; text-align: right; }
        .preview-section h3 { text-align: center; color: #a6e3a1; margin-top: 0; }
        .img-container { margin-bottom: 15px; }
        .img-container strong { color: #f9e2af; display: block; margin-bottom: 8px; }
        .icon-img { width: 100px; height: 100px; border-radius: 20px; border: 2px solid #89b4fa; object-fit: cover; }
        .cover-img { width: 100%; height: 180px; border-radius: 12px; border: 2px solid #cba6f7; object-fit: cover; }
        .screenshots-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .screenshots-grid img { width: 100%; height: 140px; border-radius: 8px; border: 1px solid #9399b2; object-fit: cover; }
    </style>
</head>
<body>
    <div class="container">
        <h2>لوحة تحكم AMR Store 🚀</h2>
        <p>أداة البحث والمعاينة وتوليد الأكواد</p>
        
        <input type="text" id="gameName" placeholder="اكتب اسم اللعبة (مثال: PUBG Mobile)" />
        <input type="text" id="customUrl" placeholder="رابط التحميل المباشر (من GitHub مثلاً)" />
        
        <button onclick="generateJSON()">بحث ومعاينة وتوليد الكود ⚡</button>
        
        <!-- قسم المعاينة البصرية -->
        <div id="previewSection" class="preview-section">
            <h3>معاينة بيانات اللعبة 🖼️</h3>
            
            <div class="img-container">
                <strong>أيقونة اللعبة:</strong>
                <img id="prevIcon" class="icon-img" src="" alt="Icon">
            </div>
            
            <div class="img-container">
                <strong>صورة الغلاف:</strong>
                <img id="prevCover" class="cover-img" src="" alt="Cover">
            </div>
            
            <div class="img-container">
                <strong>صور اللعبة (4 لقطات):</strong>
                <div class="screenshots-grid">
                    <img id="prevShot0" src="" alt="Shot 1" style="display:none;">
                    <img id="prevShot1" src="" alt="Shot 2" style="display:none;">
                    <img id="prevShot2" src="" alt="Shot 3" style="display:none;">
                    <img id="prevShot3" src="" alt="Shot 4" style="display:none;">
                </div>
            </div>
        </div>

        <textarea id="output" placeholder="سيظهر كود JSON هنا... جاهز للنسخ!"></textarea>
        <button onclick="copyCode()">نسخ الكود 📋</button>
    </div>

    <script>
        async function generateJSON() {
            const gameName = document.getElementById('gameName').value;
            const customUrl = document.getElementById('customUrl').value;
            const output = document.getElementById('output');
            const previewSection = document.getElementById('previewSection');

            if (!gameName || !customUrl) {
                alert("الرجاء كتابة اسم اللعبة ورابط التحميل المباشر أولاً!");
                return;
            }

            output.value = "جاري البحث وجلب الصور والبيانات... ⏳";
            previewSection.style.display = "none"; // إخفاء المعاينة أثناء البحث

            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(gameName)}&entity=software&limit=1&country=sa`);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    const game = data.results[0];
                    const iconUrl = game.artworkUrl512 || game.artworkUrl100;
                    const screenshots = game.screenshotUrls.slice(0, 4); 
                    const coverUrl = screenshots.length > 0 ? screenshots[0] : iconUrl; 
                    let desc = game.description || "وصف اللعبة غير متوفر حالياً.";
                    
                    if(desc.length > 250) desc = desc.substring(0, 250) + "...";

                    // === تحديث واجهة المعاينة ===
                    document.getElementById('prevIcon').src = iconUrl;
                    document.getElementById('prevCover').src = coverUrl;
                    
                    for(let i = 0; i < 4; i++) {
                        let shotImg = document.getElementById('prevShot' + i);
                        if(screenshots[i]) {
                            shotImg.src = screenshots[i];
                            shotImg.style.display = "block";
                        } else {
                            shotImg.style.display = "none";
                        }
                    }
                    previewSection.style.display = "block"; // إظهار قسم المعاينة

                    // === توليد الكود ===
                    const jsonResult = {
                        name: game.trackName,
                        description: desc,
                        iconUrl: iconUrl,
                        coverUrl: coverUrl,
                        screenshots: screenshots,
                        customUrl: customUrl
                    };

                    output.value = ",\n" + JSON.stringify(jsonResult, null, 2);
                } else {
                    output.value = "";
                    alert("لم يتم العثور على اللعبة! تأكد من كتابة الاسم الإنجليزي الصحيح للعبة.");
                }
            } catch (error) {
                output.value = "";
                alert("حدث خطأ في الاتصال، حاول مرة أخرى.");
            }
        }

        function copyCode() {
            const output = document.getElementById('output');
            if(output.value === "" || output.value.includes("جاري البحث")) return;
            output.select();
            document.execCommand('copy');
            alert("تم نسخ الكود بنجاح! 🚀 اذهب والصقه في ملف games.json");
        }
    </script>
</body>
</html>
